# PipeWire: run the graph with a 1024-sample quantum (21 ms @ 48 kHz).
# On the Pi 4 the 3.5 mm sink otherwise drops to a 128-sample quantum (2.7 ms),
# and every display page-flip from the face renderer causes an xrun = crackle.
# Luna doesn't need low latency. Install to ~/.config/pipewire/pipewire.conf.d/
context.properties = {
    default.clock.quantum     = 1024
    default.clock.min-quantum = 1024
    default.clock.max-quantum = 2048
}
