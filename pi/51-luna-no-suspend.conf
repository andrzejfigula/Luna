# WirePlumber rule: never suspend ALSA output sinks.
# The Raspberry Pi's 3.5 mm (BCM2835 PWM) output pops/crackles every time it
# powers back up after PipeWire's idle suspend (default 5 s), which lands
# right at the start of each of Luna's replies.
# Install: copy to ~/.config/wireplumber/wireplumber.conf.d/ and
#          systemctl --user restart wireplumber
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.*" } ]
    actions = { update-props = { session.suspend-timeout-seconds = 0 } }
  }
]
