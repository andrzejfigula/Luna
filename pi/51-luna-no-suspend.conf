# WirePlumber rule for ALSA outputs (install to
# ~/.config/wireplumber/wireplumber.conf.d/ and restart wireplumber):
#  - never suspend: the Pi's 3.5 mm (BCM2835 PWM) output pops when it powers
#    back up after PipeWire's idle suspend, right at the start of a reply
#  - extra ALSA headroom: more slack against display-driver DMA stalls
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.*" } ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
        api.alsa.headroom = 1024
      }
    }
  }
]
