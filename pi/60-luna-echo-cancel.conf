# Luna: echo cancelling — her own voice taken out of the microphone signal,
# so she can hear "stop!" while she talks (bargein.py) and listen right after.
# PipeWire's module-echo-cancel with the WebRTC canceller (both on the Pi).
#
#   luna_aec_sink    — a virtual speaker: Luna plays here (LUNA_SPEAKER),
#                      it forwards to the 3.5 mm jack and is the echo reference
#   luna_aec_source  — the webcam microphone, her voice removed (LUNA_MIC=pw:…)
#
# Installed / removed by tools/aec.sh (to ~/.config/pipewire/pipewire.conf.d/).
context.modules = [
    {   name = libpipewire-module-echo-cancel
        args = {
            library.name = aec/libspa-aec-webrtc
            aec.args = {
                webrtc.gain_control     = false
                webrtc.extended_filter  = true
                webrtc.noise_suppression = true
            }
            capture.props = {
                node.name     = "luna_aec_capture"
                target.object = "alsa_input.usb-046d_C270_HD_WEBCAM_200901010001-02.mono-fallback"
                node.passive  = true
            }
            source.props = {
                node.name        = "luna_aec_source"
                node.description = "Luna mic (echo-cancelled)"
            }
            sink.props = {
                node.name        = "luna_aec_sink"
                node.description = "Luna speaker (echo reference)"
            }
            playback.props = {
                node.name     = "luna_aec_playback"
                target.object = "alsa_output.platform-fe00b840.mailbox.stereo-fallback"
                node.passive  = true
            }
        }
    }
]
